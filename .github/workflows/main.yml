name: Keep Database Active

on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL:-}" ]]; then
            echo "SUPABASE_URL secret is missing."
            exit 1
          fi
          if [[ -z "${SUPABASE_ANON_KEY:-}" ]]; then
            echo "SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi
          if [[ "$SUPABASE_URL" != https://* ]]; then
            echo "SUPABASE_URL must start with https://."
            exit 1
          fi

          supabase_url="${SUPABASE_URL%/}"
          curl \
            --head \
            --fail \
            --silent \
            --show-error \
            --retry 4 \
            --retry-delay 5 \
            --connect-timeout 15 \
            --max-time 45 \
            --output /dev/null \
            --write-out "Supabase database request returned HTTP %{http_code}\n" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${supabase_url}/rest/v1/owners?select=id&limit=1"
